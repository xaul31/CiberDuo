<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar pregunta - CiberDuo</title>
</head>
<body>
    <h1>Editar pregunta</h1>
    <form method="POST">
        {% csrf_token %}
        <p>
            <label>Perfil:</label>
            <select name="perfil" required>
                {% for perfil in perfiles %}
                    <option value="{{ perfil.id }}" {% if perfil.id == pregunta.perfil.id %}selected{% endif %}>
                        {{ perfil.nombre }}
                    </option>
                {% endfor %}
            </select>
        </p>

        <p>
            <label>Tipo de amenaza:</label>
            <select name="tipo_amenaza" required>
                {% for tipo in tipos_amenaza %}
                    <option value="{{ tipo.id }}" {% if tipo.id == pregunta.tipo_amenaza.id %}selected{% endif %}>
                        {{ tipo.nombre }}
                    </option>
                {% endfor %}
            </select>
        </p>

        <p>
            <label>Medio:</label>
            <select name="medio" required>
                {% for medio in medios %}
                    <option value="{{ medio.id }}" {% if medio.id == pregunta.medio.id %}selected{% endif %}>
                        {{ medio.nombre }}
                    </option>
                {% endfor %}
            </select>
        </p>

        <p>
            <label>Enunciado:</label><br>
            <textarea name="enunciado" required>{{ pregunta.enunciado }}</textarea>
        </p>

        <p>
            <label>Mensaje simulado:</label><br>
            <textarea name="mensaje_simulado" required>{{ pregunta.mensaje_simulado }}</textarea>
        </p>

        <p>
            <button type="submit">Guardar cambios</button>
        </p>
    
</body>
</html>
